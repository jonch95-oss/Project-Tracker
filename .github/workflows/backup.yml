name: Nightly backup

# pg_dump → Vercel Blob (private store), keeping the newest 30 dumps.
# Neon's free plan only keeps a 6-hour restore window, so this is the real backup.
on:
  schedule:
    - cron: "15 8 * * *" # ~3–4am New York
  workflow_dispatch:

concurrency:
  group: nightly-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Direct (unpooled) Neon connection string; Vercel's Neon integration names it DATABASE_URL_UNPOOLED.
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ops
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL 17 client (matches Neon) and the Blob SDK
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          npm install --no-save --no-package-lock @vercel/blob@2
      - name: Dump, verify, upload, prune
        run: |
          set -euo pipefail
          file="project-command-$(date -u +%Y-%m-%dT%H%M%SZ).dump"
          pg_dump --format=custom --compress=9 --no-owner --no-privileges --file="$file" "$DATABASE_URL"
          pg_restore --list "$file" > /dev/null   # the archive is readable
          result=$(node scripts/ops/blob-backup.mjs upload "$file")
          echo "$result"
          body=$(echo "$result" | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(JSON.stringify({objectKey:r.objectKey,sizeBytes:r.sizeBytes,kind:"nightly"}))')
          curl -sS --fail --max-time 60 -X POST -H "Authorization: Bearer ${CRON_SECRET}" -H "content-type: application/json" \
            -d "$body" "${APP_URL}/api/jobs/record-backup"
      - name: Report runner minutes
        if: always()
        run: scripts/ops/report-run.sh nightly-backup "${{ job.status }}"
