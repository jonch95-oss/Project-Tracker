name: Records probe
# On request: prints live NYC Open Data metadata (dataset names, freshness, column names)
# so the public-records watch is coded against the real schemas (brief §10). Public data only.
on:
  # Runs when the request file changes (the probe reads its ids, searches and queries from it).
  push:
    paths: [".github/records-probe.txt"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/records-probe.txt
          sparse-checkout-cone-mode: false
      - name: Metadata
        run: |
          IDS=$(grep '^ids:' .github/records-probe.txt | cut -d: -f2-)
          SEARCH=$(grep '^search:' .github/records-probe.txt | cut -d: -f2-)
          QUERIES=$(grep '^queries:' .github/records-probe.txt | cut -d: -f2-)
          for id in $IDS; do
            echo "=== $id"
            curl -s "https://data.cityofnewyork.us/api/views/$id.json" | jq -c '{name, rowsUpdatedAt: (.rowsUpdatedAt|todate?), cols: [.columns[]? | .fieldName]}' || true
          done
          IFS=';'
          for q in $SEARCH; do
            echo "=== search: $q"
            curl -s -G "https://api.us.socrata.com/api/catalog/v1" --data-urlencode "domains=data.cityofnewyork.us" --data-urlencode "q=$q" --data-urlencode "limit=8" | jq -c '.results[] | {id: .resource.id, name: .resource.name, updated: .resource.data_updated_at}' || true
          done
          IFS='|'
          for q in $QUERIES; do
            echo "=== query: $q"
            curl -s "https://data.cityofnewyork.us/resource/$q" | head -c 3000; echo
          done
